<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cabGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Background Badge -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#facc15" stroke-opacity="0.22" stroke-width="6" />

  <!-- Subtle Road Strip at Bottom -->
  <rect x="64" y="372" width="384" height="22" rx="11" fill="#1e293b" />
  <rect x="116" y="380" width="56" height="6" rx="3" fill="#64748b" />
  <rect x="228" y="380" width="56" height="6" rx="3" fill="#64748b" />
  <rect x="340" y="380" width="56" height="6" rx="3" fill="#64748b" />

  <!-- Taxi Roof Sign -->
  <rect x="200" y="128" width="112" height="36" rx="10" fill="#fef08a" stroke="#ca8a04" stroke-width="4" />
  <text x="256" y="153" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="22" fill="#0f172a" letter-spacing="2">TAXI</text>

  <!-- Cabin -->
  <path d="M144 236 L176 164 L336 164 L368 236 Z" fill="url(#cabGrad)" />
  <!-- Windshield & Windows -->
  <path d="M164 232 L186 178 L250 178 L250 232 Z" fill="#0f172a" opacity="0.88" />
  <path d="M262 232 L262 178 L326 178 L348 232 Z" fill="#0f172a" opacity="0.88" />

  <!-- Lower Taxi Body -->
  <rect x="76" y="232" width="360" height="92" rx="26" fill="url(#cabGrad)" />

  <!-- Bumpers -->
  <rect x="64" y="294" width="28" height="24" rx="8" fill="#334155" />
  <rect x="420" y="294" width="28" height="24" rx="8" fill="#334155" />

  <!-- Headlight & Taillight -->
  <rect x="412" y="246" width="22" height="26" rx="6" fill="#fef9c3" />
  <rect x="78" y="246" width="20" height="26" rx="6" fill="#ef4444" />

  <!-- Side Checker Stripe -->
  <rect x="136" y="268" width="22" height="16" fill="#0f172a" />
  <rect x="158" y="284" width="22" height="16" fill="#0f172a" />
  <rect x="180" y="268" width="22" height="16" fill="#0f172a" />
  <rect x="202" y="284" width="22" height="16" fill="#0f172a" />
  <rect x="224" y="268" width="22" height="16" fill="#0f172a" />
  <rect x="246" y="284" width="22" height="16" fill="#0f172a" />
  <rect x="268" y="268" width="22" height="16" fill="#0f172a" />
  <rect x="290" y="284" width="22" height="16" fill="#0f172a" />
  <rect x="312" y="268" width="22" height="16" fill="#0f172a" />
  <rect x="334" y="284" width="22" height="16" fill="#0f172a" />
  <rect x="356" y="268" width="22" height="16" fill="#0f172a" />

  <!-- Wheels -->
  <circle cx="156" cy="330" r="42" fill="#0f172a" />
  <circle cx="156" cy="330" r="22" fill="#94a3b8" />
  <circle cx="156" cy="330" r="9" fill="#334155" />

  <circle cx="356" cy="330" r="42" fill="#0f172a" />
